[package]
name = "zetaanim"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]

[dev-dependencies]
zl-scene = { path = "crates/zl-scene" }
zl-render = { path = "crates/zl-render" }
zl-primitives = { path = "crates/zl-primitives" }
zl-export = { path = "crates/zl-export" }
glam = { workspace = true }

[workspace]
members = ["crates/*"]

[workspace.dependencies]
glam = "0.34"
num-complex = "0.4"
kurbo = "0.13"
tiny-skia = "0.12"
serde = { version = "1", features = ["derive"] }
